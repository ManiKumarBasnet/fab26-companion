<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAB26 Boston · SuperFabLab Companion</title>
<meta name="description" content="FAB26 Boston attendee companion — map, time-grid schedule, personal agenda with leave-now alerts, speakers to meet. Built by SuperFabLab Bhutan.">
<meta name="theme-color" content="#002855">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --navy:#002855; --bg:#04162E; --panel:#0B2547; --panel-2:#10305C;
  --line:rgba(140,180,230,.16); --line-2:rgba(140,180,230,.32);
  --txt:#EAF2FC; --txt-2:#9FB6D4; --txt-3:#6883A6;
  --org:#FF6B35; --cyn:#25C9FF; --mag:#FF3D8A; --lim:#A6E22E; --yel:#FFC24B; --grn:#19C99A; --pur:#8B7BFF;
  --k:#8B7BFF; --e15:#19C99A; --e14:#FF6B35; --mus:#FF3D8A; --fhk:#FFC24B; --off:#7E93AE;
  --r:14px; --sh:0 10px 30px rgba(0,10,30,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1100px 480px at 85% -10%,rgba(37,201,255,.10),transparent),radial-gradient(900px 480px at -10% 30%,rgba(255,107,53,.08),transparent)}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyn);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.disp{font-family:Sora,sans-serif}

/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:1000;background:linear-gradient(180deg,var(--navy),#00224A);border-bottom:1px solid var(--line)}
header .in{max-width:780px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-family:Sora,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:baseline}
.logo b{color:#fff}.logo i{font-style:normal;background:linear-gradient(90deg,var(--org),var(--mag),var(--cyn));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--txt-3);margin-left:8px;letter-spacing:.18em}
.teamchip{margin-left:auto;display:flex;align-items:center;gap:7px;background:rgba(37,201,255,.10);border:1px solid rgba(37,201,255,.35);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;color:#BFE9FF;white-space:nowrap}
.teamchip .dotb{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--yel),var(--org))}

/* ===== MAP ===== */
#mapwrap{position:relative;height:min(42vh,400px);border-bottom:1px solid var(--line)}
#map{position:absolute;inset:0}
.leaflet-container{background:#DFE7F0;font:inherit}
.vtip{background:#fff;border:0;border-radius:6px;box-shadow:0 2px 8px rgba(0,20,50,.35);color:#0B2547;font:800 10.5px/1.2 Manrope,sans-serif;padding:3px 7px;white-space:nowrap}
.vtip::before{display:none}
.mapbar{position:absolute;left:10px;right:10px;bottom:10px;z-index:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mapbtn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border:1px solid var(--line-2);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:800;box-shadow:var(--sh)}
.mapbtn.accent{background:linear-gradient(90deg,var(--org),#FF8A3D);border:0}
.mapbtn svg{width:14px;height:14px}
#basePill{background:rgba(255,255,255,.94);color:var(--navy);border:0;font-weight:800;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
#geoNote{width:100%;font-size:11.5px;color:#FFD9A8;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.crossp{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:800;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}

/* ===== TABS ===== */
.tabs{position:sticky;top:49px;z-index:990;background:rgba(4,22,46,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs .in{max-width:780px;margin:0 auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
.tab{flex:none;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:800;color:var(--txt-2);border:1px solid transparent;white-space:nowrap}
.tab.on{color:#fff;background:var(--panel-2);border-color:var(--line-2)}
.tab .n{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--org);color:#fff;font-size:10.5px;margin-left:5px}
main{max-width:780px;margin:0 auto;padding:18px 14px 80px}
h2.sec{font-family:Sora,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.01em;margin:6px 0 3px}
p.sub{font-size:13px;color:var(--txt-2);margin:0 0 14px}
.grad{background:linear-gradient(90deg,var(--cyn),var(--lim));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== DAY PICKER ===== */
.daypick{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding-bottom:2px}
.dp{flex:none;text-align:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 13px;min-width:64px}
.dp .dw{font-size:11px;font-weight:800;color:var(--txt-2)}
.dp .dn{font-family:Sora,sans-serif;font-weight:800;font-size:17px;line-height:1.1}
.dp.on{background:linear-gradient(135deg,var(--panel-2),#153A6E);border-color:var(--cyn);box-shadow:0 0 0 1px rgba(37,201,255,.3)}
.dp.on .dw{color:var(--cyn)}

/* ===== TIME SLOTS ===== */
.slot{display:flex;align-items:center;gap:12px;margin:22px 0 10px}
.tbig{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;letter-spacing:-.02em;color:#04162E;background:linear-gradient(135deg,var(--lim),#7ED957);border-radius:10px;padding:5px 12px;box-shadow:0 4px 14px rgba(166,226,46,.25)}
.slot.evening .tbig{background:linear-gradient(135deg,var(--mag),#FF6FA5);color:#fff;box-shadow:0 4px 14px rgba(255,61,138,.3)}
.tline{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.tpar{font-size:11px;font-weight:800;color:var(--txt-3);letter-spacing:.08em;text-transform:uppercase}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}

/* ===== EVENT CARDS ===== */
.ev{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px 10px;transition:all .15s}
.ev.sel{background:var(--panel-2);border-color:rgba(255,107,53,.55);box-shadow:0 0 0 1px rgba(255,107,53,.3)}
.ev .toprow{display:flex;align-items:flex-start;gap:8px}
.vbox{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--vc);color:#04162E;font-weight:800;font-size:11px;border-radius:7px;padding:4px 9px;letter-spacing:.02em}
.vbox.dark{color:#fff}
.vbox .wm{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;opacity:.85;border-left:1.5px solid rgba(0,0,0,.25);padding-left:6px}
.vbox.dark .wm{border-color:rgba(255,255,255,.35)}
.ev .nm{font-size:13.5px;font-weight:700;line-height:1.3}
.ev .botrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kind{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2.5px 8px}
.kind.keynote{background:linear-gradient(90deg,var(--mag),var(--org));color:#fff}
.kind.workshop{border:1.5px dashed var(--cyn);color:var(--cyn)}
.kind.talks{border:1.5px solid var(--pur);color:#B9AFFF}
.kind.food{background:var(--yel);color:#3A2600}
.kind.social{background:linear-gradient(90deg,var(--pur),var(--cyn));color:#fff}
.kind.kids{border:1.5px solid var(--mag);color:#FF9BC4;border-radius:999px}
.kind.info{background:rgba(126,147,174,.25);color:var(--txt-2)}
.kind.business{background:var(--grn);color:#04261C}
.badge{font-size:9.5px;font-weight:800;letter-spacing:.05em;background:linear-gradient(90deg,var(--org),var(--mag));color:#fff;border-radius:4px;padding:2px 6px}
.ev .acts{position:absolute;top:9px;right:9px;display:flex;gap:5px}
.star{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel-2);color:var(--txt-3);transition:all .15s}
.star.on{background:linear-gradient(135deg,var(--org),#FF9046);border-color:transparent;color:#fff}
.star svg{width:14px;height:14px}
.golink{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2)}
.golink svg{width:12px;height:12px}
.leave{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--lim);font-weight:600}

/* ===== OVERVIEW DASHBOARD ===== */
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:center}
.stat b{display:block;font-family:Sora,sans-serif;font-weight:800;font-size:26px;background:linear-gradient(90deg,var(--cyn),var(--lim));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11px;font-weight:700;color:var(--txt-2);letter-spacing:.05em;text-transform:uppercase}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:14px}
.panelbox h3{font-family:Sora,sans-serif;font-weight:700;font-size:13.5px;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.vload{display:flex;flex-direction:column;gap:8px}
.vl{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:9px;font-size:12px}
.vl .lbl{font-weight:800}
.vl .bar{height:14px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.vl .bar i{display:block;height:100%;border-radius:6px;background:var(--vc)}
.vl .ct{font-family:'IBM Plex Mono',monospace;color:var(--txt-2);text-align:right}
.kmix{display:flex;gap:7px;flex-wrap:wrap}
.kmix .kind{font-size:10.5px;padding:5px 11px}
.kmix .kind em{font-style:normal;font-family:'IBM Plex Mono',monospace;opacity:.85;margin-left:5px}
.daystrip{display:flex;flex-direction:column;gap:9px}
.ds{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--panel-2)}
.ds .dl{font-weight:800}
.ds .dots{display:flex;gap:4px;flex-wrap:wrap}
.ds .dots i{width:11px;height:11px;border-radius:3.5px;background:var(--vc)}
.ds .tm{font-family:'IBM Plex Mono',monospace;color:var(--txt-2);white-space:nowrap}

/* ===== PRIORITY / SPEAKERS / AGENDA ===== */
.prio{position:relative;overflow:hidden;background:linear-gradient(135deg,#0C2A52,#123A6E);border:1px solid rgba(37,201,255,.35);border-radius:var(--r);padding:15px 16px 13px;margin-bottom:16px}
.prio .kick{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--cyn);text-transform:uppercase}
.prio h3{font-family:Sora,sans-serif;font-weight:800;font-size:16px;margin:3px 0 8px}
.prio ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.prio li{display:flex;gap:9px}
.prio li b{color:var(--yel);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;flex:none;width:76px;padding-top:1px}
.atools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.abtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800}
.abtn.hot{background:linear-gradient(90deg,var(--grn),#14A67F);border:0;color:#04261C}
.abtn svg{width:14px;height:14px}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--txt-2);font-size:13.5px}
.sp{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.sp.on{border-color:rgba(255,194,75,.6);background:var(--panel-2)}
.av{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.sp .bd{flex:1;min-width:0}
.sp .nm{font-weight:800;font-size:14px}
.sp .rl{font-size:12px;color:var(--txt-2)}
.sp .wh{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--txt-3);margin-top:1px}
.meet{flex:none;border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;color:var(--txt-2)}
.meet.on{background:linear-gradient(90deg,var(--yel),var(--org));border:0;color:#3A1D00}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(80px);background:#fff;color:var(--navy);font-weight:800;font-size:13px;border-radius:999px;padding:11px 18px;box-shadow:var(--sh);transition:transform .25s;z-index:2000;max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
footer{max-width:780px;margin:0 auto;padding:0 14px 26px;font-size:11.5px;color:var(--txt-3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
footer b{color:var(--txt-2)}
</style>
</head>

 const R=6371000,r=x=>x*Math.PI/180;
 const a=Math.sin(r(v.lat-base.lat)/2)**2+Math.cos(r(base.lat))*Math.cos(r(v.lat))*Math.sin(r(v.lng-base.lng)/2)**2;
 return Math.max(1,Math.round(2*R*Math.asin(Math.sqrt(a))*1.35/78))};

   <li><b>Tue 14:30</b><span>Scalable Structural Robotic Assembly, Miana Smith (CBA) — E14, 6-633</span></li>
   <li><b>Wed 14:30</b><span>Robotic Craft in the CBA Shops — E15, LL</span></li>
   <li><b>Fri 18:00</b><span>Business meeting with CBA — E15 (confirm room & time)</span></li></ul></div>
  <h2 class="sec">Schedule <span class="grad">· by time slot</span></h2>
  <p class="sub">Full official program. Same time = same group; colored box = venue + your walk minutes; mono text = room. Series of 10-min talks are shown as one block (×n) — <a href="https://fab26.fabevent.org/programs/schedule" target="_blank" rel="noopener" style="text-decoration:underline">full lineup here</a>. Tap ★ to add to agenda.</p>
  <div class="daypick" id="daypick"></div><div id="dayev"></div>`);
 const dp=$("#daypick");
 DAYS.forEach((d,i)=>{const b=document.createElement("button");b.className="dp"+(i===curDay?" on":"");
  b.innerHTML=`<div class="dw">${d.dw}</div><div class="dn">${d.dn}</div>`;
  b.onclick=()=>{curDay=i;store.set("f26_day",i);render()};dp.appendChild(b)});
 const box=$("#dayev"),d=DAYS[curDay];
 box.insertAdjacentHTML("beforeend",`<p class="sub" style="margin-bottom:2px"><b class="disp" style="font-size:15px;color:#fff">${d.dw} ${d.dn} · ${d.t}</b></p>`);
 slots(d.ev).forEach(([tm,evs])=>{
  box.insertAdjacentHTML("beforeend",slotHead(tm,evs.length));
  const g=document.createElement("div");g.className="slotgrid";
  evs.forEach(e=>g.appendChild(evCard(e)));box.appendChild(g)});}

/* ================= AGENDA ================= */
function renderAgenda(){
 C.insertAdjacentHTML("beforeend",`<h2 class="sec">My Agenda</h2>
  <p class="sub">Green time = when to leave your base (walk + 5 min). Alerts fire while the app is open; the calendar file carries the same alarms even when it isn't.</p>
  <div class="atools">
   <button class="abtn hot" id="ics"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0l-3-3m3 3l3-3M3 13.5h10"/></svg>Add to calendar (.ics)</button>
   <button class="abtn" id="alerts">${alertsOn?"🔔 Alerts on":"🔕 Enable leave-now alerts"}</button>
  </div>`);
 if(!picks.size){C.insertAdjacentHTML("beforeend",`<div class="empty">Nothing selected yet.<br>Open <b>Schedule</b> and tap ★ on sessions.</div>`);}
 else DAYS.forEach(d=>{
  const sel=d.ev.filter(e=>picks.has(e[0]));if(!sel.length)return;
  C.insertAdjacentHTML("beforeend",`<p class="sub" style="margin:14px 0 2px"><b class="disp" style="font-size:15px;color:#fff">${d.dw} ${d.dn} · ${d.t}</b></p>`);
  slots(sel).forEach(([tm,evs])=>{
   C.insertAdjacentHTML("beforeend",slotHead(tm,evs.length));
   const g=document.createElement("div");g.className="slotgrid";
   evs.forEach(e=>{const v=VEN[e[3]],w=walk(v);let lv="";
    if(w){const[a,b]=e[1].split(":").map(Number);const t=new Date(0,0,0,a,b-w-5);
     lv=`<span class="leave">⏰ leave ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}</span>`}
    g.appendChild(evCard(e,{leave:lv}))});
   C.appendChild(g)})});
 $("#ics").onclick=exportICS;
 $("#alerts").onclick=async()=>{
  if(!alertsOn){if("Notification"in window&&Notification.permission!=="granted")await Notification.requestPermission();
   alertsOn=true;toast("Alerts on while the app is open")}
  else{alertsOn=false;toast("Alerts off")}
  store.set("f26_alerts",alertsOn);render()};}

/* ================= SPEAKERS ================= */
function renderSpeakers(){
 C.insertAdjacentHTML("beforeend",`<h2 class="sec">Speakers <span class="grad">· must-meet</span></h2>
  <p class="sub">Where and when to find each. Your voxel collaborators are pre-flagged for the team.</p>`);
 SPK.forEach((s,i)=>{const[nm,rl,wh,ini,a1,a2]=s,on=meets.has(i);
  const el=document.createElement("div");el.className="sp"+(on?" on":"");
  el.innerHTML=`<span class="av" style="--a1:${a1};--a2:${a2}">${ini}</span>
   <div class="bd"><div class="nm">${nm}</div><div class="rl">${rl}</div><div class="wh">${wh}</div></div>
   <button class="meet${on?" on":""}" aria-pressed="${on}">${on?"MUST MEET ✓":"+ Meet"}</button>`;
  el.querySelector(".meet").onclick=()=>{on?meets.delete(i):meets.add(i);store.set("f26_meets",[...meets]);render()};
  C.appendChild(el)});}

/* ================= ICS ================= */
function exportICS(){
 if(!picks.size){toast("Pick sessions first ★");return}
 const pad=n=>String(n).padStart(2,"0");
 let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SuperFabLab Bhutan//FAB26//EN"];
 picks.forEach(id=>{const{d,e}=findEv(id),[,tm,nm,vk]=e,v=VEN[vk],w=walk(v)||12;
  const[Y,Mo,Da]=d.date.split("-").map(Number),[h,mi]=tm.split(":").map(Number);
  const st=new Date(Y,Mo-1,Da,h,mi),en=new Date(st.getTime()+60*60000);
  const fmt=dt=>`${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
  out.push("BEGIN:VEVENT",`UID:${id}@fab26.superfablab.bt`,
   `DTSTART;TZID=America/New_York:${fmt(st)}`,
   `DTEND;TZID=America/New_York:${fmt(en)}`,
   `SUMMARY:FAB26 · ${nm}`,`LOCATION:${v.n}, ${v.ad}`,
   `DESCRIPTION:Walk ${w} min from base. Directions: ${gmaps(v).replace(/,/g,"\\,")}`,
   "BEGIN:VALARM","ACTION:DISPLAY",`TRIGGER:-PT${w+5}M`,
   `DESCRIPTION:Leave now — ${w} min walk to ${v.s}`,"END:VALARM","END:VEVENT")});
 out.push("END:VCALENDAR");
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([out.join("\r\n")],{type:"text/calendar"}));
 a.download="FAB26-my-agenda.ics";a.click();toast("Calendar file downloaded — open to import")}

/* ================= LIVE ALERTS ================= */
setInterval(()=>{if(!alertsOn||!base)return;
 const now=new Date();
 picks.forEach(id=>{if(fired.has(id))return;
  const{d,e}=findEv(id),[,tm,nm,vk]=e,v=VEN[vk],w=walk(v);if(!w)return;
  const[h,mi]=tm.split(":").map(Number);
  const start=new Date(`${d.date}T${pad2(h)}:${pad2(mi)}:00`);
  const leave=new Date(start-(w+5)*60000);
  if(now>=leave&&now<start){fired.add(id);
   const msg=`Leave now → ${nm} @ ${v.s} (${w} min walk)`;
   if("Notification"in window&&Notification.permission==="granted")new Notification("FAB26 · time to go",{body:msg});
   toast("🔔 "+msg);navigator.vibrate?.([180,90,180])}})},30000);
const pad2=n=>String(n).padStart(2,"0");

render();
</script>
